<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>City Clicker — Persian</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <main id="app">
    <header>
      <div>
        <h1>شهر</h1>
        <span>City Clicker — Persian</span>
      </div>
      <div class="stats">
        <b id="money">۰</b><span>تومان</span>
        <i></i>
        <b id="income">۰</b><span>در ثانیه</span>
      </div>
    </header>
    <section class="toolbar">
      <button id="build-house">ساخت خانه <small>۱۰۰</small></button>
      <button id="earn">کلیک دستی <small>+۱</small></button>
      <span id="hint">یک خانه انتخاب کن و روی زمین کلیک کن.</span>
    </section>
    <canvas id="city"></canvas>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
