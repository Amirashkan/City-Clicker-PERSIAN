<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>شهر — City Clicker</title>
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<main id="app">
  <header class="topbar">
    <div class="brand">
      <h1>شهر</h1>
      <span>City Clicker</span>
    </div>

    <button id="settings-button" class="settings-button" type="button" aria-label="تنظیمات">⚙</button>
    <div class="hud">
      <div class="money-stat">
        <b id="money">۵۰۰</b>
        <span>تومان</span>
      </div>
      <div class="mini-stat">
        <span>درآمد</span>
        <b id="income">۰</b>
        <small>/ ثانیه</small>
      </div>
      <div class="mini-stat">
        <span>هر لمس</span>
        <b id="click-value">۱</b>
      </div>
    </div>
  </header>

  <div id="settings-panel" class="settings-panel" aria-hidden="true">
    <div class="settings-card">
      <button id="settings-close" class="settings-close" type="button" aria-label="بستن">×</button>
      <div class="settings-title">تنظیمات</div>
      <div class="settings-group">
        <div class="settings-label">حالت نمایش</div>
        <div class="settings-options" role="group" aria-label="حالت نمایش">
          <button type="button" data-theme="light">روشن</button>
          <button type="button" data-theme="dark">تاریک</button>
        </div>
      </div>
      <div class="settings-group">
        <div class="settings-label">سایز رابط کاربری</div>
        <div class="ui-size-row">
          <button type="button" data-ui-size="small">کوچک</button>
          <button type="button" data-ui-size="normal">معمولی</button>
          <button type="button" data-ui-size="large">بزرگ</button>
        </div>
      </div>
    </div>
  </div>

  <section class="city-stage">
    <canvas id="city" aria-label="شهر؛ برای دریافت پول لمس کنید"></canvas>

    <div id="hint" class="hint" aria-live="polite">برای درآمد روی شهر بزن.</div>
    <div id="click-feedback" aria-hidden="true"></div>
    <aside id="building-panel" aria-live="polite"></aside>

    <section class="build-dock" aria-label="ساختمان‌ها">
      <div class="dock-head">
        <strong>ساخت‌وساز</strong>
        <button id="cancel-build" type="button">لغو</button>
      </div>
      <div id="building-tools"></div>
    </section>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
